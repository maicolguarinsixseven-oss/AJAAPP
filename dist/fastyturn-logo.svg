<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" role="img" aria-label="FastyTurn - Citas Médicas Sincronizadas" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4FBF"/>
      <stop offset="1" stop-color="#2A7DE1"/>
    </linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FB5A8"/>
      <stop offset="1" stop-color="#14968F"/>
    </linearGradient>
    <linearGradient id="gCross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B5FD0"/>
      <stop offset="1" stop-color="#1FB5A8"/>
    </linearGradient>
  </defs>

  <!-- Flecha circular azul -->
  <path d="M 213.4 210 A 100 100 0 0 1 342.3 69.4" fill="none" stroke="url(#gBlue)" stroke-width="18" stroke-linecap="round"/>
  <polygon points="369.5,82.1 351.6,49.5 333,89.3" fill="#2A7DE1" stroke="#2A7DE1" stroke-width="4" stroke-linejoin="round"/>

  <!-- Flecha circular verde azulado -->
  <path d="M 386.6 110 A 100 100 0 0 1 257.7 250.6" fill="none" stroke="url(#gTeal)" stroke-width="18" stroke-linecap="round"/>
  <polygon points="230.5,237.9 248.4,270.5 267,230.7" fill="#1FB5A8" stroke="#1FB5A8" stroke-width="4" stroke-linejoin="round"/>

  <!-- Cruz médica -->
  <polygon points="276,105 324,105 324,136 355,136 355,184 324,184 324,215 276,215 276,184 245,184 245,136 276,136"
           fill="#FFFFFF" stroke="url(#gCross)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Pulso cardíaco -->
  <path d="M 262 160 H 283 L 291 138 L 301 184 L 311 146 L 317 160 H 338"
        fill="none" stroke="#14A398" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nombre -->
  <text x="300" y="332" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="88" font-weight="800">
    <tspan fill="#1F5FBF">Fasty</tspan><tspan fill="#1AA39A">Turn</tspan>
  </text>

  <!-- Eslogan -->
  <text x="300" y="388" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" fill="#555B66" letter-spacing="1.2">
    Citas Médicas Sincronizadas
  </text>
</svg>
